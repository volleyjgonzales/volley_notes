<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-label="How to read the robot in these figures"><title>How to read the robot in these figures</title><defs><marker id="ah-primary" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah-secondary" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B82F6"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EA580C"/></marker><marker id="ah-bg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EFF6FF"/></marker><marker id="ah-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E40AF"/></marker><marker id="ah-card" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E9EFF8"/></marker><marker id="ah-mutedfg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-border" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BFDBFE"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7490"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="ah-tape" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><pattern id="hatch-red" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#DC2626" opacity="0.08"/><line x1="0" y1="0" x2="0" y2="8" stroke="#DC2626" stroke-width="2" opacity="0.35"/></pattern></defs><rect x="1" y="1" width="958" height="328" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/><text x="28" y="40" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1E40AF" text-anchor="start" style="white-space:pre" xml:space="preserve">How to read the robot in these figures</text><text x="28" y="62" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" style="white-space:pre" xml:space="preserve">Top-down view. The orange end is always the front. Plan views are drawn to scale: 1 m = 40 px</text><g transform="translate(220 180) rotate(0)"><rect x="-41.9" y="-47" width="32" height="6" rx="2" fill="#0F172A"/><rect x="-41.9" y="41" width="32" height="6" rx="2" fill="#0F172A"/><rect x="9.9" y="-47" width="32" height="6" rx="2" fill="#0F172A"/><rect x="9.9" y="41" width="32" height="6" rx="2" fill="#0F172A"/><rect x="-72" y="-44" width="144" height="88" rx="10" fill="#FFFFFF" stroke="#1E40AF" stroke-width="2"/><line x1="-60" y1="-15.4" x2="-44" y2="-15.4" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="-60" y1="15.4" x2="-44" y2="15.4" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><rect x="58" y="-42" width="14" height="84" rx="2" fill="#EA580C"/><path d="M -17.3 -22 L 28.8 0 L -17.3 22 Z" fill="#1E40AF"/></g><line x1="148" y1="250" x2="292" y2="250" stroke="#475569" stroke-width="1" stroke-linecap="round" marker-end="url(#ah-mutedfg)"/><line x1="292" y1="250" x2="148" y2="250" stroke="#475569" stroke-width="1" stroke-linecap="round" marker-end="url(#ah-mutedfg)"/><text x="220" y="268" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" style="white-space:pre" xml:space="preserve">1.8 m (assumed)</text><line x1="126" y1="136" x2="126" y2="224" stroke="#475569" stroke-width="1" stroke-linecap="round" marker-end="url(#ah-mutedfg)"/><line x1="126" y1="224" x2="126" y2="136" stroke="#475569" stroke-width="1" stroke-linecap="round" marker-end="url(#ah-mutedfg)"/><text x="118" y="184" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#475569" text-anchor="end" style="white-space:pre" xml:space="preserve">1.1 m</text><line x1="302" y1="180" x2="362" y2="180" stroke="#EA580C" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah-accent)"/><text x="306" y="170" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#EA580C" text-anchor="start" style="white-space:pre" xml:space="preserve">heading</text><text x="40" y="304" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start" style="white-space:pre" xml:space="preserve">Shown here at 2× scale. Orange bumper = front, chevron points forward, slots = rear.</text><text x="560" y="104" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1E40AF" text-anchor="start" style="white-space:pre" xml:space="preserve">Same robot at plan-view scale</text><g transform="translate(600 140) rotate(0)"><rect x="-21" y="-25" width="16" height="6" rx="2" fill="#0F172A"/><rect x="-21" y="19" width="16" height="6" rx="2" fill="#0F172A"/><rect x="5" y="-25" width="16" height="6" rx="2" fill="#0F172A"/><rect x="5" y="19" width="16" height="6" rx="2" fill="#0F172A"/><rect x="-36" y="-22" width="72" height="44" rx="5" fill="#FFFFFF" stroke="#1E40AF" stroke-width="2"/><line x1="-30" y1="-7.7" x2="-22" y2="-7.7" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="-30" y1="7.7" x2="-22" y2="7.7" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><rect x="29" y="-20" width="7" height="40" rx="2" fill="#EA580C"/><path d="M -8.6 -11 L 14.4 0 L -8.6 11 Z" fill="#1E40AF"/></g><rect x="660" y="137" width="20" height="6" rx="0" fill="#0F172A" /><rect x="680" y="137" width="20" height="6" rx="0" fill="#FFFFFF" stroke="#0F172A" stroke-width="1" /><text x="708" y="144" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" style="white-space:pre" xml:space="preserve">1 m</text><text x="560" y="194" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1E40AF" text-anchor="start" style="white-space:pre" xml:space="preserve">Symbols</text><line x1="560" y1="220" x2="630" y2="220" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="butt"/><text x="646" y="224" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" s