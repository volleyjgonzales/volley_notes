<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="655" viewBox="0 0 1000 655" role="img" aria-labelledby="title desc">
<title id="title">Device release lifecycle</title><desc id="desc">CLI behavior shown; the external OS module and Mender state mapping are not supplied.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52708a"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f8fc"/>
<text x="35" y="40" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="bold" fill="#173451">Device release lifecycle</text>
<text x="35" y="68" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#52708a">CLI behavior shown; the external OS module and Mender state mapping are not supplied.</text>
<polyline points="195,220 195,295" fill="none" stroke="#52708a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="205" y="253" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#31546b">install</text>
<polyline points="335,342 400,342" fill="none" stroke="#52708a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="343" y="283" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#31546b">rename</text>
<polyline points="470,390 195,500" fill="none" stroke="#52708a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="255" y="448" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#31546b">accept</text>
<polyline points="610,390 800,500" fill="none" stroke="#52708a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="735" y="440" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#31546b">reject</text>
<polyline points="680,295 800,210" fill="none" stroke="#52708a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="705" y="257" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#31546b">power cut window</text>
<polyline points="800,210 970,210 970,557 945,557" fill="none" stroke="#52708a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="815" y="435" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#31546b">rollback recovery</text>
<rect x="55" y="110" width="280" height="110" rx="10" fill="#ffffff" stroke="#8ca6bb" stroke-width="1.5"/>
<text x="195.0" y="137" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#173451">Before install</text>
<text x="195.0" y="160" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#173451">live = previous release</text>
<text x="195.0" y="183" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#173451">staged = extracted new payload</text>
<text x="195.0" y="206" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#173451">last = older backup, if present</text>
<rect x="55" y="295" width="280" height="95" rx="10" fill="#ffffff" stroke="#8ca6bb" stroke-width="1.5"/>
<text x="195.0" y="322" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#173451">Remove owned stacks</text>
<text x="195.0" y="345" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#173451">Metadata + .pending in staged</text>
<text x="195.0" y="368" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#173451">Carry .env.local if not shipped</text>
<rect x="400" y="295" width="280" height="95" rx="10" fill="#e0f5ef" stroke="#16836e" stroke-width="1.5"/>
<text x="540.0" y="322" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#173451">Swap release trees</text>
<text x="540.0" y="345" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#173451">Delete old last; live → last</text>
<text x="540.0" y="368" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#173451">staged → live; deploy automatic</text>
<rect x="55" y="500" width="280" height="90" rx="10" fill="#e0f5ef" stroke="#16836e" stroke-width="1.5"/>
<text x="195.0" y="527" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#173451">Commit</text>
<text x="195.0" y="550" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#173451">Remove live/.pending</text>
<text x="195.0" y="573" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#173451">Previous tree stays in last</text>
<rect x="655" y="500" width="290" height="115" rx="10" fill="#e0f5ef" stroke="#16836e" stroke-width="1.5"/>
<text x="800.0" y="527" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#173451">Rollback while pending</text>
<text x="800.0" y="550" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#173451">Remove owned stacks</text>
<text x="800.0" y="573" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#173451">failed live → staged; last → live</text>
<text x="800.0" y="596" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#173451">Clear marker; redeploy</text>
<rect x="655" y="110" width="290" height="100" rx="10" fill="#fff3db" stroke="#bc8418" stroke-width="1.5"/>
<text x="800.0" y="137" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#173451">Interrupted between renames</text>
<text x="800.0" y="160" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#173451">live absent, last exists</text>
<text x="800.0" y="183" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#173451">recover(): last → live</text>
<text x="800.0" y="206" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#173451">Invoked by release rollback</text>
</svg>