<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">CI job dependencies</title><desc id="desc">Triggers: main/release pushes, matching release tags, and pull requests.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52708a"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f8fc"/>
<text x="35" y="40" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="bold" fill="#173451">CI job dependencies</text>
<text x="35" y="68" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#52708a">Triggers: main/release pushes, matching release tags, and pull requests.</text>
<polyline points="420,185 250,255" fill="none" stroke="#52708a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="240" y="217" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#31546b">builder image</text>
<polyline points="580,185 750,255" fill="none" stroke="#52708a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="610" y="217" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#31546b">builder image</text>
<polyline points="250,330 420,405" fill="none" stroke="#52708a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="235" y="370" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#31546b">check passes</text>
<polyline points="750,330 580,405" fill="none" stroke="#52708a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="650" y="370" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#31546b">CLI + tests pass</text>
<polyline points="500,185 500,405" fill="none" stroke="#52708a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="510" y="365" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#31546b">direct dependency</text>
<polyline points="500,490 500,565" fill="none" stroke="#52708a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="510" y="530" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#31546b">artifact ready</text>
<polyline points="900,295 950,295 950,600 650,600" fill="none" stroke="#52708a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="825" y="583" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#31546b">CLI asset</text>
<rect x="350" y="110" width="300" height="75" rx="10" fill="#ffffff" stroke="#8ca6bb" stroke-width="1.5"/>
<text x="500.0" y="137" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#173451">builder-image</text>
<text x="500.0" y="160" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#173451">Build + push builder-&lt;full SHA&gt;</text>
<rect x="100" y="255" width="300" height="75" rx="10" fill="#ffffff" stroke="#8ca6bb" stroke-width="1.5"/>
<text x="250.0" y="282" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#173451">static-analysis</text>
<text x="250.0" y="305" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#173451">prek run --all-files</text>
<rect x="600" y="255" width="300" height="75" rx="10" fill="#ffffff" stroke="#8ca6bb" stroke-width="1.5"/>
<text x="750.0" y="282" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#173451">swarmctl</text>
<text x="750.0" y="305" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#173451">pytest → shiv → Actions artifact</text>
<rect x="350" y="405" width="300" height="85" rx="10" fill="#e0f5ef" stroke="#16836e" stroke-width="1.5"/>
<text x="500.0" y="432" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#173451">mender-artifact</text>
<text x="500.0" y="455" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#173451">Needs builder + both checks</text>
<text x="500.0" y="478" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#173451">Build, upload to Mender, retain in CI</text>
<rect x="350" y="565" width="300" height="65" rx="10" fill="#e0f5ef" stroke="#16836e" stroke-width="1.5"/>
<text x="500.0" y="592" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#173451">github-release (tags only)</text>
<text x="500.0" y="615" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#173451">Attach CLI and .mender assets</text>
</svg>