Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2563EB" text-anchor="start" style="white-space:pre" xml:space="preserve">7.4  gains change smoothly with commanded speed</text><line x1="752" y1="120" x2="752" y2="288" stroke="#0E7490" stroke-width="2.2" stroke-linecap="round"/><line x1="746" y1="120" x2="758" y2="120" stroke="#0E7490" stroke-width="2.2" stroke-linecap="round"/><line x1="746" y1="288" x2="758" y2="288" stroke="#0E7490" stroke-width="2.2" stroke-linecap="round"/><text x="766" y="190" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0E7490" text-anchor="start" style="white-space:pre" xml:space="preserve">7.5  same column</text><text x="766" y="208" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0E7490" text-anchor="start" style="white-space:pre" xml:space="preserve">for every payload</text><text x="40" y="380" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#DC2626" text-anchor="start" style="white-space:pre" xml:space="preserve">Ruled out</text><circle cx="54" cy="410" r="8" fill="#DC2626"/><path d="M 50 406 L 58 414 M 58 406 L 50 414" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="414" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" style="white-space:pre" xml:space="preserve">one hard-coded set per motion primitive (violates 7.4)</text><circle cx="54" cy="438" r="8" fill="#DC2626"/><path d="M 50 434 L 58 442 M 58 434 L 50 442" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="442" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" style="white-space:pre" xml:space="preserve">separate tables per payload weight (violates 7.5)</text><rect x="520" y="372" width="412" height="70.4" rx="6" fill="#EFF6FF" /><rect x="520" y="372" width="4" height="70.4" rx="2" fill="#EA580C" /><text x="534" y="394.4" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" style="white-space:pre" xml:space="preserve">8.5: the AGV can't measure payload weight today,</text><text x="534" y="411.9" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" style="white-space:pre" xml:space="preserve">so it couldn't pick a per-weight table anyway.</text><text x="534" y="429.4" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" style="white-space:pre" xml:space="preserve">Ask HITO to test 7.4 at all three loads.</text><rect x="40" y="462" width="157.7" height="22" rx="11" fill="#2563EB" opacity="0.12" /><rect x="40" y="462" width="157.7" height="22" rx="11" fill="none" stroke="#2563EB" stroke-width="1" /><circle cx="51" cy="473" r="7" fill="#2563EB"/><text x="51" y="477" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" style="white-space:pre" xml:space="preserve">I</text><text x="63" y="477.5" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#2563EB" text-anchor="start" style="white-space:pre" xml:space="preserve">7.4  Will implement</text><text x="209.7" y="477.5" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start" style="white-space:pre" xml:space="preserve">30 + 30 days</text><rect x="400" y="462" width="19