oke-linecap="round"/><text x="60" y="274" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" style="white-space:pre" xml:space="preserve">drive wheels</text><text x="560" y="104" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1E40AF" text-anchor="start" style="white-space:pre" xml:space="preserve">Other symbols</text><line x1="560" y1="136" x2="630" y2="136" stroke="#94A3B8" stroke-width="8" stroke-linecap="butt"/><line x1="560" y1="136" x2="630" y2="136" stroke="#CBD5E1" stroke-width="1" stroke-linecap="butt" stroke-dasharray="2 6"/><text x="646" y="140" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" style="white-space:pre" xml:space="preserve">magnetic tape</text><circle cx="595" cy="172" r="7" fill="#1E40AF" stroke="#1E40AF" stroke-width="2"/><text x="646" y="176" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" style="white-space:pre" xml:space="preserve">node (order waypoint)</text><rect x="590" y="201" width="10" height="10" rx="1" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.5" /><text x="646" y="210" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" style="white-space:pre" xml:space="preserve">RFID tag</text><g transform="translate(595 246) rotate(0)" opacity="0.45"><rect x="-12.8" y="-16.8" width="9.6" height="6" rx="2" fill="#0F172A"/><rect x="-12.8" y="10.8" width="9.6" height="6" rx="2" fill="#0F172A"/><rect x="3.2" y="-16.8" width="9.6" height="6" rx="2" fill="#0F172A"/><rect x="3.2" y="10.8" width="9.6" height="6" rx="2" fill="#0F172A"/><rect x="-22.2" y="-13.8" width="44.4" height="27.6" rx="3" fill="#FFFFFF" stroke="#1E