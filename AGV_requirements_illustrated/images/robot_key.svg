" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7490"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="ah-tape" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><pattern id="hatch-red" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#DC2626" opacity="0.08"/><line x1="0" y1="0" x2="0" y2="8" stroke="#DC2626" stroke-width="2" opacity="0.35"/></pattern></defs><rect x="1" y="1" width="958" height="298" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/><text x="28" y="40" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1E40AF" text-anchor="start" style="white-space:pre" xml:space="preserve">How to read the robot in these figures</text><text x="28" y="62" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" style="white-space:pre" xml:space="preserve">Top-down view. The vehicle is rectangular; the orange end is always the front</text><g transform="translate(220 175) rotate(0)"><rect x="-40.5" y="-46.7" width="30.4" height="6" rx="2" fill="#0F172A"/><rect x="-40.5" y="40.7" width="30.4" height="6" rx="2" fill="#0F172A"/><rect x="10.1" y="-46.7" width="30.4" heig