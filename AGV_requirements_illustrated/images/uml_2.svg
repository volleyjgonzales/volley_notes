olas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" style="white-space:pre" xml:space="preserve">factsheet</text><rect x="193.1" y="200" width="28.9" height="15" rx="7.5" fill="#EA580C" /><text x="207.6" y="211" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" style="white-space:pre" xml:space="preserve">2.1</text><text x="38" y="237" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#EA580C" text-anchor="start" style="white-space:pre" xml:space="preserve" font-style="italic">whole message sent with MQTT</text><text x="38" y="251" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#EA580C" text-anchor="start" style="white-space:pre" xml:space="preserve" font-style="italic">retain = true</text><text x="38" y="281" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#64748B" text-anchor="start" style="white-space:pre" xml:space="preserve" font-style="italic">+6 parts</text><rect x="28" y="314" width="200" height="44" rx="4" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.4" /><rect x="28" y="314" width="200" height="30" rx="4" fill="#1E40AF" /><rect x="28" y="340" width="200" height="4" rx="0" fill="#1E40AF" /><line x1="28" y1="344" x2="228" y2="344" stroke="#1E40AF" stroke-width="1" stroke-linecap="round"/><text x="38" y="326" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#BFDBFE" text-anchor="start" style="white-space:pre" xml:space="preserve">«topic · fleet → AGV»</text><text x="38" y="339" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" style="white-space:pre" xml:space="preserve">instantActions</text><p