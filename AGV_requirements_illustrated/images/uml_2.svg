e-space:pre" xml:space="preserve">e.g. stopPause</text><text x="276" y="395" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="400" fill="#475569" text-anchor="start" style="white-space:pre" xml:space="preserve">actionId</text><text x="276" y="414" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#64748B" text-anchor="start" style="white-space:pre" xml:space="preserve" font-style="italic">+2 fields  +1 parts</text><rect x="28" y="447" width="200" height="55" rx="4" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.4" /><rect x="28" y="447" width="200" height="30" rx="4" fill="#1E40AF" /><rect x="28" y="473" width="200" height="4" rx="0" fill="#1E40AF" /><line x1="28" y1="477" x2="228" y2="477" stroke="#1E40AF" stroke-width="1" stroke-linecap="round"/><text x="38" y="459" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#BFDBFE" text-anchor="start" style="white-space:pre" xml:space="preserve">«topic · AGV → fleet»</text><text x="38" y="472" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" style="white-space:pre" xml:space="preserve">state</text><text x="38" y="495" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#64748B" text-anchor="start" style="white-space:pre" xml:space="preserve" font-style="italic">+9 fields  +9 parts</text><path d="M 238 462.0 L 242 462.0 L 242 462.0 L 266 462.0" fill="none" stroke="#1E40AF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 228 462.0 L 233 458.0 L 238 462.0 L 233 466.0 Z" fill="#1E40AF"/><text x="263" y="458" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.5" font-weight="400" fill="#1E40AF" text-anchor="end" style="white-space:pre" xml:space="preserve">0..*</text><rect x="266" y="447" width="200" height="107" rx="4" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.4" /><rect x="266" y="447" width="200" height="30" rx="4" fill="#EFF6FF" /><rect x="266" y="473" width="200" height="4" rx="0" fill="#EFF6FF" /><line x1="266" y1="477" x2="466" y2="477" stroke="#1E40AF" stroke-width="1" stroke-linecap="round"/><text x="276" y="458" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#475569" text-anchor="start" style="white-space:pre" xml:space="preserve">type ActionState</text><text x="276" y="472" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1E40AF" text-anchor="start" style="white-space:pre" xml:space="preserve">actionStates[ ]</text><text x="276" y="495" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="400" fill="#475569" text-anchor="start" style="white-space:pre" xml:space="preserve">actionId</text><rect x="269" y="501" width="194" height="31" rx="3" fill="#EA580C" opacity="0.12" /><text x="276" y="514" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="600" fill="#0F172A" text-anchor="start" style="white-space:pre" xml:space="preserve">actionStatus</text><rect x="405.9" y="503" width="54.1" height="15" rx="7.5" fill="#EA580C" /><text x="432.9" y="514" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" style="white-space:pre" xml:space="preserve">2.5 2.6</text><text x="284" y="527" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#EA580C" text-anchor="start" style="white-space:pre" xml:space="preserve">FINISHED only once applied</text><text x="276" y="547" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#64748B" text-anchor="start" style="white-space:pre" xml:space="preserve" font-style="italic">+2 fields</text><path d="M 28 584 L 33 580 L 38 584 L 33 588 Z" fill="#1E40AF"/><line x1="38" y1="584" x2="70" y2="584" stroke="#1E40AF" stroke-width="1.3" stroke-linecap="round"/><text x="78" y="588" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" style="white-space:pre" xml:space="preserve">composition: the part is nested inside its parent</text><text x="390" y="588" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="400" fill="#475569" text-anchor="start" style="white-space:pre" xml:space="preserve">0..1 optional · 1 one · 0..* / 1..* list [ ]</text><rect x="731.1" y="577" width="28.9" height="15" rx="7.5" fill="#EA580C" /><text x="745.5" y="588" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" style="white-space:pre" xml:space="preserve">x.y</text><text x="768" y="588" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" style="white-space:pre" xml:space="preserve">field named by requirement</text><text x="28" y="614" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" style="white-space:pre" xml:space="preserve">The retain flag is an MQTT transport setting, not a field inside the message.</text><text x="28" y="632" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" style="white-space:pre" xml:space="preserve">actionStates[].actionId matches the actionId the fleet sent, which is how a command is tracked to FINISHED.</text></svg>