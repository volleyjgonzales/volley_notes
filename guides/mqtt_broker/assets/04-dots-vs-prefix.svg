t="700" fill="white" font-family="monospace">0</text><rect x="556" y="186" width="25" height="40" rx="4" fill="#0b9488"/><text x="568.5" y="213" text-anchor="middle" font-size="17" font-weight="700" fill="white" font-family="monospace">0</text><rect x="583" y="186" width="25" height="40" rx="4" fill="#0b9488"/><text x="595.5" y="213" text-anchor="middle" font-size="17" font-weight="700" fill="white" font-family="monospace">0</text><rect x="610" y="186" width="25" height="40" rx="4" fill="#0b9488"/><text x="622.5" y="213" text-anchor="middle" font-size="17" font-weight="700" fill="white" font-family="monospace">0</text><rect x="637" y="186" width="25" height="40" rx="4" fill="#0b9488"/><text x="649.5" y="213" text-anchor="middle" font-size="17" font-weight="700" fill="white" font-family="monospace">0</text><rect x="664" y="186" width="25" height="40" rx="4" fill="#0b9488"/><text x="676.5" y="213" text-anchor="middle" font-size="17" font-weight="700" fill="white" font-family="monospace">0</text><rect x="691" y="186" width="25" height="40" rx="4" fill="#0b9488"/><text x="703.5" y="213" text-anchor="middle" font-size="17" font-weight="700" fill="white" font-family="monospace">0</text><rect x="718" y="186" width="25" height="40" rx="4" fill="#0b9488"/><text x="730.5" y="213" text-anchor="middle" font-size="17" font-weight="700" fill="white" font-family="monospace">0</text><rect x="745" y="186" width="25" height="40" rx="4" fill="#e6a044"/><text x="757.5" y="213" text-anchor="middle" font-size="17" font-weight="700" fill="white" font-family="monospace">0</text><rect x="772" y="186" width="25" height="40" rx="4" fill="#e6a044"/><text x="784.5" y="213" text-anchor="middle" font-size="17" font-weight="700" fill="white" font-family="monospace">1</text><rect x="799" y="186" width="25" height="40" rx="4" fill="#e6a044"/><text x="811.5" y="213" text-anchor="middle" font-size="17" font-weight="700" fill="white" font-family="monospace">1</text><rect x="826" y="186" width="25" height="40" rx="4" fill="#e6a044"/><text x="838.5" y="213" text-anchor="middle" font-size="17" font-weight="700" fill="white" font-family="monospace">1</text><rect x="853" y="186" width="25" height="40" rx="4" fill="#e6a044"/><text x="865.5" y="213" text-anchor="middle" font-size="17" font-weight="700" fill="white" font-family="monospace">1</text><rect x="880" y="186" width="25" height="40" rx="4" fill="#e6a044"/><text x="892.5" y="213" text-anchor="middle" font-size="17" font-weight="700" fill="white" font-family="monospace">1</text><rect x="907" y="186" width="25" height="40" rx="4" fill="#e6a044"/><text x="919.5" y="213" text-anchor="middle" font-size="17" font-weight="700" fill="white" font-family="monospace">1</text><rect x="934" y="186" width="25" height="40" rx="4" fill="#e6a044"/><text x="946.5" y="213" text-anchor="middle" font-size="17" font-weight="700" fill="white" font-family="monospace">1</text><rect x="961" y="186" width="25" height="40" rx="4" fill="#e6a044"/><text x="973.5" y="213" text-anchor="middle" font-size="17" font-weight="700" fill="white" font-family="monospace">1</text><rect x="988" y="186" width="25" height="40" rx="4" fill="#e6a044"/><text x="1000.5" y="213" text-anchor="middle" font-size="17" font-weight="700" fill="white" font-family="monospace">0</text><text x="163.5" y="176" text-anchor="middle" font-size="11" fill="#61728b" font-family="Inter,Arial">bit 1</text><text x="352.5" y="176" text-anchor="middle" font-size="11" fill="#61728b" font-family="Inter,Arial">bit 8</text><text x="568.5" y="176" text-anchor="middle" font-size="11" fill="#61728b" font-family="Inter,Arial">bit 16</text><text x="730.5" y="176" text-anchor="middle" font-size="11" fill="#61728b" font-family="Inter,Arial">bit 22</text><text x="784.5" y="176" text-anchor="middle" font-size="11" fill="#61728b" font-family="Inter,Arial">bit 24</text><text x="1000.5" y="176" text-anchor="middle" font-size="11" fill="#61728b" font-family="Inter,Arial">bit 32</text><text x="136" y="212" text-anchor="end" font-size="12" font-weight="700" fill="#61728b" font-family="Inter,Arial">10.0.1.254</text><line x1="366" y1="156" x2="366" y2="300" stroke="#101d2e" stroke-width="3"/><circle cx="366" cy="150" r="4" fill="#101d2e"/><line x1="582" y1="156" x2="582" y2="300" stroke="#101d2e" stroke-width="3"/><circle cx="582" cy="150" r="4" fill="#101d2e"/><line x1="798" y1="156" x2="798" y2="300" stroke="#101d2e" stroke-width="3"/><circle cx="798" cy="150" r="4" fill="#101d2e"/><line x1="744" y1="156" x2="744" y2="360" stroke="#ef9d37" stroke-width="3" stroke-dasharray="5 4"/><text x="744" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#ef9d37" font-family="Inter,Arial">/22</text><text x="136" y="262" text-anchor="end" font-size="12" font-weight="700" fill="#61728b" font-family="Inter,Arial">WRITTEN AS</text><path d="M 153 240 L 153 248 L 363 248 L 363 240" stroke="#101d2e" stroke-width="2" fill="none"/><text x="258.0" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#101d2e" font-family="Inter,Arial">10</text><text x="258.0" y="285" text-anchor="middle" font-size="12" fill="#61728b" font-family="Inter,Arial">8 bits</text><path d="M 369 240 L 369 248 L 579 248 L 579 240" stroke="#101d2e" stroke-width="2" fill="none"/><text x="474.0" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#101d2e" font-family="Inter,Arial">0</text><text x="474.0" y="285" text-anchor="middle" font-size="12" fill="#61728b" font-family="Inter,Arial">8 bits</text><path d="M 585 240 L 585 248 L 795 248 L 795 240" stroke="#101d2e" stroke-width="2" fill="none"/><text x="690.0" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#101d2e" font-family="Inter,Arial">1</text><text x="690.0" y="285" text-anchor="middle" font-size="12" fill="#61728b" font-family="Inter,Arial">8 bits</text><path d="M 801 240 L 801 248 L 1011 248 L 1011 240" stroke="#101d2e" stroke-width="2" fill="none"/><text x="906.0" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#101d2e" font-family="Inter,Arial">254</text><text x="906.0" y="285" text-anchor="middle" font-size="12" fill="#61728b" font-family="Inter,Arial">8 bits</text><text x="136" y="334" text-anchor="end" font-size="12" font-weight="700" fill="#61728b" font-family="Inter,Arial">READ BY /22</text><path d="M 153 312 L 153 320 L 741 320 L 741 312" stroke="#0b9488" stroke-width="2" fill="none"/><text x="447.0" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#0b9488" font-family="Inter,Arial">network: 22 bits</text><text x="447.0" y="357" text-anchor="middle" font-size="12" fill="#61728b" font-family="Inter,Arial">fixed on this network (10.0.0.x, x = 0..3)</text><path d="M 747 312 L 747 320 L 1011 320 L 1011 312" stroke="#c97f12" stroke-width="2" fill="none"/><text x="879.0" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#c97f12" font-family="Inter,Arial">host: 10 bits</text><text x="879.0" y="357" text-anchor="middle" font-size="12" fill="#61728b" font-family="Inter,Arial">varies per device (0..1023; this one is 510)</text><text x="136" y="406" text-anchor="end" font-size="12" font-weight="700" fill="#61728b" font-family="Inter,Arial">IF IT WERE /24</text><path d="M 153 384 L 153 392 L 795 392 L 795 384" stroke="#8fa2b8" stroke-width="2" fill="none"/><text x="474.0" y="412" text-anchor="middle" font-size="15" font-weight="700" fill="#8fa2b8" font-family="Inter,Arial">network: 24 bits</text><text x="474.0" y="429" text-anchor="middle" font-size="12" fill="#61728b" font-family="Inter,Arial">line lands exactly on the third dot</text><path d="M 801 384 L 801 392 L 1011 392 L 1011 384" stroke="#8fa2b8" stroke-width="2" fill="none"/><text x="906.0" y="412" text-anchor="middle" font-size="15" font-weight="700" fill="#8fa2b8" font-family="Inter,Arial">host: 8 bits</text><text x="906.0" y="429" text-anchor="middle" font-size="12" fill="#61728b" font-family="Inter,Arial">only then is "3 octets + 1 octet" true</text><text x="550" y="458" text-anchor="middle" fill="#61728b" font-size="14" font-family="Inter,Arial">The dots never move. The prefix line can land anywhere, including inside an octet.</text></svg>