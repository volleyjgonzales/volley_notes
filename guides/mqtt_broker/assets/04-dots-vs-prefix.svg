<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="100%" height="100%" fill="#f5f8fc"/><rect x="22" y="20" width="1056" height="480" rx="18" fill="#ffffff" stroke="#cbd7e5"/><text x="52" y="63" fill="#101d2e" font-size="23" font-weight="700" font-family="Inter,Arial,sans-serif">Two different groupings of the same 32 bits</text><text x="52" y="88" fill="#61728b" font-size="14" font-family="Inter,Arial,sans-serif">The dots are fixed by the notation. The /22 line is set by the mask. They do not have to agree.</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6dd5"/></marker></defs><line x1="150" y1="118" x2="172" y2="118" stroke="#101d2e" stroke-width="3"/><text x="180" y="122" font-family="Inter,Arial" font-size="14" fill="#20324b">Octet dot: always after bits 8, 16, 24</text><line x1="490" y1="118" x2="512" y2="118" stroke="#ef9d37" stroke-width="3" stroke-dasharray="5 4"/><text x="520" y="122" font-family="Inter,Arial" font-size="14" fill="#20324b">/22 line: after bit 22, set by the subnet mask</text><rect x="151" y="186" width="25" height="40" rx="4" fill="#0b9488"/><text x="163.5" y="213" text-anchor="middle" font-size="17" font-weight="700" fill="white" font-family="monospace">0</text><rect x="178" y="186" width="25" height="40" rx="4" fill="#0b9488"/><text x="190.5" y="213" text-anchor="middle" font-size="17" font-weight="700" fill="white" font-family="monospace">0</text><rect x="205" y="186" width="25" height="40" rx="4" fill="#0b9488"/><text x="217.5" y="213" text-anchor="middle" font-size="17" font-weight="700" fill="white" font-family="monospace">0</text><rect x="232" y="186" width="25" height="40" rx="4" fill="#0b9488"/><text x="244.5" y="213" text-anchor="middle" font-size="17" font-weight="700" fill="white" font-family="monospace">0</text><rect x="259" y="186" width="25" height="40" rx=