<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><rect width="100%" height="100%" fill="#f5f8fc"/><rect x="22" y="20" width="956" height="320" rx="18" fill="#ffffff" stroke="#cbd7e5"/><text x="52" y="63" fill="#101d2e" font-size="23" font-weight="700" font-family="Inter,Arial,sans-serif">Troubleshooting | Discover, verify, connect</text><text x="52" y="88" fill="#61728b" font-size="14" font-family="Inter,Arial,sans-serif">A successful TCP connection is evidence of an open port, not proof that MQTT authorization will succeed.</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6dd5"/></marker></defs><rect x="52" y="145" width="210" height="98" rx="13" fill="#ffffff" stroke="#2f6dd5" stroke-width="2"/><rect x="52" y="145" width="7" height="98" rx="3" fill="#2f6dd5"/><text x="72" y="178" fill="#20324b" font-size="19" font-weight="700" font-family="Inter,Arial">1. Inspect</text><text x="72" y="202" fill="#61728b" font-size="14" font-family="Inter,Arial">ip -4 addr, ip route</text><path d="M 264 190 L 286 190" stroke="#2f6dd5" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="291" y="145" width="210" height="98" rx="13" fill="#ffffff" stroke="#2f6dd5" stroke-width="2"/><rect x="291" y="145" width="7" height="98" rx="3" fill="#2f6dd5"/><text x="311" y="178" fill="#20324b" font-size="19" font-weight="700" font-family="Inter,Arial">2. Scan</text><text x="311" y="202" fill="#61728b" font-size="14" font-family="Inter,Arial">nmap TCP 1883</text><path d="M 503 190 L 525 190" stroke="#2f6dd5" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="530" y="145" width="210" height="98" rx="13" fill="#ffffff" stroke="#2f6dd5" stroke-width="2"/><rect x="530" y="145" width="7" height="98" rx="3" fill="#2f6dd5"/><text x="550" y="178" fill="#20324b" font-size="19" font-weight="700" font-family="Inter,Arial">3. Verify</text><text x="550" y="202" fill="#61728b" font-size="14" font-family="Inter,Arial">mosquitto_sub</text><path d="M 742 190 L 764 190" stroke="#2f6dd5" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="769" y="145" width="210" height="98" rx="13" fill="#ffffff" stroke="#0b9488" stroke-width="2"/><rect x="769" y="145" width="7" height="98" rx="3" fill="#0b9488"/><text x="789" y="178" fill="#20324b" font-size="19" font-weight="700" font-family="Inter,Arial">4. Connect</text><text x="789" y="202" fill="#61728b" font-size="14" font-family="Inter,Arial">MQTT Explorer</text><text x="500" y="304" text-anchor="middle" font-size="15" fill="#61728b" font-family="Inter,Arial">Known working example: 10.0.1.173:1883 (observed October 13, 2026)</text></svg>