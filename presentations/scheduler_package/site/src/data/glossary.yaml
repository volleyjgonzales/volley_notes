# Keyword links for the study site.
#
# Each entry turns the first mention of a term in every section into a link to the place that explains it.
#   code:  inline-code spellings that link (exact text of a `code` span)
#   text:  plain-text phrases that link (whole words, case-sensitive)
#   to:    id of the heading that explains the term (ids are in src/content/*.html; the build fails if it is missing)
#   def:   one-line definition shown on hover and in search
#   decl:  optional spelling from src/data/definitions.yaml (or an interfaces message, e.g. GaragePoseMsg)
#          whose source definition the hover window also shows when the link is a plain-text phrase
#
# A term is not linked inside the section it points to.
# Names from before PR #1018 (SW2-1135) are kept as extra `code` spellings where the pack still quotes them,
# mostly in the Issue & proposal tab's history and rename tables.

- term: PlanContext
  decl: "PlanContext"
  code: [PlanContext, PlanContextSPtr, "volley::scheduler::PlanContext", ScheduleContext, ScheduleContextSPtr, plan_ctx]
  to: bg-schedulecontext-the-per-call-workspace
  def: "All mutable data for one Plan() call (plan_context.hpp; ScheduleContext before PR #1018); created at the start of Plan() and freed when it returns."

- term: initial_state
  code: [initial_state, ctx->initial_state]
  to: bg-the-definition-annotated
  def: "The garage at request time, with everything used by base_schedule marked disabled (reserved). Never changed after construction."

- term: keep_out_filter_by_footprint
  code: [keep_out_filter_by_footprint, "ctx->keep_out_filter_by_footprint", FindKeepOutFilter, BuildKeepOutFilters, disabledness_filters, "ctx->disabledness_filters", GetDisabledEntitiesFilters]
  to: bg-disabledness-filters-the-keep-out-map
  def: "Keep-out map built once per Plan() call by BuildKeepOutFilters: per footprint type, the graph vertices and edges that reserved or disabled assets and nodes make unusable (disabledness_filters before PR #1018)."

- term: base_schedule reservation
  code: [ExcludeCommittedResources, SetAgvDisabled, SetNodeDisabled, SetBayDisabled, SetVecsDisabled]
  to: bg-the-base-schedule-reserved-assets-and-keep-out-filters
  def: "ExcludeCommittedResources marks every AGV, bay, VECS and AGV-command source and destination node of the running base_schedule as disabled, so the new plan never uses them."

- term: OnEvent
  code: [OnEvent, "state.OnEvent", "DiscreteGarageState::OnEvent"]
  to: bg-what-onevent-is
  def: "DiscreteGarageState's overloaded event handlers (common_ros): one per garage event message; each checks the event against the state, then changes it, and returns a BoolStringPair."

- term: scheduled_jobs
  code: [scheduled_jobs, ctx->scheduled_jobs, result.scheduled_jobs, AddScheduledJob]
  to: bg-scheduled_jobs-in-detail
  def: "Jobs that expanded successfully, in request order; entry k is the job whose events carry job_index k. A job that fails expansion leaves no entry and no events."

- term: job_index
  code: [job_index, job_index_, GetJobIndex(), GetJobIndex]
  to: bg-scheduled_jobs-in-detail
  def: Position of a job in ctx->scheduled_jobs, stamped on every event the job creates.

- term: ScheduledJobData
  decl: "ScheduledJobDataMsg"
