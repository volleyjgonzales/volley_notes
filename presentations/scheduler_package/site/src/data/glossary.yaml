  code: [MotionCostParams, "cost::MotionCostParams", MotionCostModel, "cost::MotionCostModel", cost_model_]
  to: bg-what-can-be-configured
  def: Speeds, accelerations and event durations from ROS parameters; the only knobs of the motion planner.
  decl: MotionCostParams

- term: motion_planner toolbox
  code: [SingleSourceSearch, "volley::SingleSourceSearch", FindPosePath, "volley::FindPosePath", BuildStaticObstacleFilter, BuildStaticObstacleFilters, FindAgvUnderTrayAssignment, GraphFilterProperties, "volley::GraphFilterProperties", GetPosePath, GetStaticFilter, HideAgvs]
  to: bg-the-motion-planner-toolbox
  def: Single-agent searches and filters used while the event DAG is built; CHUGG is the only multi-agent planner.

- term: SIPP
  code: [SippAgv, "volley::SippAgv", SippEnvironment, SafeIntervalTable, SippState, SippGoal]
  text: [SIPP, safe intervals, safe interval]
  to: bg-sipp-the-single-agv-search
  def: Safe Interval Path Planning - CHUGG's single-AGV search over (place, safe time window) states.
  decl: SippAgv

- term: Prioritized planning
  text: [prioritized planning, sequential assumption]
  to: bg-inside-solvesequential
  def: Plan one event at a time against everything already planned, in the event DAG's topological order, never revising earlier choices.

- term: Trapezoid profile
  code: [Trapezoid, "cost::Trapezoid", TimeAtDistance, MotionRun, CoalesceMotionRuns]
  text: [trapezoid profile, trapezoidal velocity profile]
  to: bg-the-cost-model
  def: Accelerate, cruise, decelerate - the timing model for every move; a short move is a triangle that never reaches full speed.
  decl: Trapezoid

- term: faces_reciprocal
  code: [faces_reciprocal]
  to: ly-faces-reciprocal-and-the-inbound-heading
  def: "Layout key for bays and chargers. When true, the inbound heading is headings[0] + 180 (returned unwrapped by GetInboundHeading; the scheduler wraps it in MakeInboundPose since PR #1018)."

- term: rotation_allowed
  code: [rotation_allowed]
  to: ly-rotation-allowed
  def: "Layout key. When true, an AGV may turn in place at the node; PoseGraph adds ROT_LEFT / ROT_RIGHT neighbours. Pecos allows it only at W8 and W22."

- term: max_resource_size
  code: [max_resource_size, max_resource_size_index]
  to: ly-max-resource-size
  def: "Layout key naming the largest payload window allowed at a node; stored as its index in the area-sorted window list."

- term: parking_windows
  code: [parking_windows, parking_window_buffer]
  to: ly-parking-windows-and-the-buffer
  def: "The payload size classes in the layout file (plus an automatic TRAY window), sorted by area; a window's position is its resource size index."

- term: disallowed_edge_orientation
  code: [disallowed_edge_orientation]
  to: ly-edges
  def: "Optional layout edge key; removes that heading and its reciprocal from the edge in the PoseGraph."

- term: prioritization_value
  code: [prioritization_value, bay_prioritization_]
  to: ly-bay-only-fields
  def: "Layout key on bays; bays are ordered by it, highest first (ties: higher bay id first). Pecos order is [21, 7]."

- term: Dispatch
  code: [Dispatch, DispatchRos, central, "Dispatch::GetPlannerServiceRequest", PlanClientCallback, ShouldCallPlanner]
  text: [Dispatch]
  to: ds-the-central-package-at-a-glance
  def: "The dispatcher in the central package: queues jobs, calls the scheduler's Plan service, checks the response and executes the schedule. The scheduler's only client."

