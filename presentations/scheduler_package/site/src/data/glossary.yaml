  to: bg-scheduledjobdatamsg-what-one-entry-holds
  def: One per pending job in the response - the job with its status, its action indices, and for a retrieve the bay-arrival action.

- term: MakeFailedJob
  code: [MakeFailedJob, JobFailure, FailJob]
  to: bg-scheduled_jobs-in-detail
  def: "Builds the response entry of a failed job - STATE_ERROR, the failure message and retain_job (JobFailure::is_retryable). FailJob before PR #1018."

- term: last_event_by_entity
