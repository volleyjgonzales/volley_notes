      GetDisabledEntitiesFilters(const GarageGraph& gg, const DiscreteGarageState& state,
                                 const CollisionTable& table);
  - names: [SingleSourceSearch, "volley::SingleSourceSearch", BlockingTrayState, "volley::BlockingTrayState", OpenSpaceSearchEnvironment, "volley::OpenSpaceSearchEnvironment", BlockingTraySearchEnvironment, "volley::BlockingTraySearchEnvironment", EmptyTraySearchEnvironment, "volley::EmptyTraySearchEnvironment"]
    title: "SingleSourceSearch and its environments"
    file: "motion_planner/blocking_tray_search.hpp (not supplied)"
    note: "Reconstructed from call sites in scheduler.cpp. One generic best-first search, specialised by an 'environment' that defines neighbours, costs and what counts as a target."
    sketch: |
      struct BlockingTrayState { GarageGraph::Vertex vert; /* ... */ };   // search node

      template <typename Env>
      /* Solution */ SingleSourceSearch(BlockingTrayState source, Interval::Duration start_cost,
                                        Env& env);
      //   solution.GetTarget() -> std::optional<BlockingTrayState>   best target found
      //   solution.GetPath(t)  -> std::optional<sequence of (state, cost)> back to source

      // Where can this tray go? (repark, root tray's open space; may allow waypoint stash)
      OpenSpaceSearchEnvironment(tray_id, footprint, gg, table, state, cost_model,
                                 illegal_poses, filters, /* nullopt */, enforce_retrieval_heading,
                                 allow_waypoint_stash);
      // Which trays are in the way of moving this tray to dest?
      BlockingTraySearchEnvironment(tray_id, footprint, gg, table, state, cost_model,
                                    dest_vertex, filters);
      // Nearest empty tray to a pose (the inverse of the open-space search)
      EmptyTraySearchEnvironment(gg, table, state, cost_model, filters);
  - names: [GetPosePath, "volley::GetPosePath", GetEdgeDurations, "volley::GetEdgeDurations", GetAllPairsMinCost, "volley::GetAllPairsMinCost", HideAgvs, "volley::HideAgvs"]
    title: "Single-agent path helpers"
    file: "motion_planner/garage_graph_pathing.hpp, agv_hiding_search.hpp (not supplied)"
    note: "Reconstructed from call sites in scheduler.cpp."
    sketch: |
      // Shortest pose path for ONE entity, ignoring everyone else's timing (empty if none).
      std::vector<GaragePoseMsg> GetPosePath(const GarageGraph& gg, GaragePoseMsg from,
          GaragePoseMsg to, const cost::MotionCostModel& cost,
          std::optional<GraphFilterProperties> filters);

      // Traversal time of every edge ("full Trapezoid": accelerate, cruise, brake).
      /* edge -> Interval::Duration */ GetEdgeDurations(const GarageGraph& gg,
                                                        const cost::MotionCostModel& cost);

      // Cost-to-go between all vertex pairs, used as CHUGG's A* heuristic.
      /* (from, to) -> Duration */ GetAllPairsMinCost(const GarageGraph& gg, edge_durations,
