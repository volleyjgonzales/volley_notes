  # ---- motion_planner, cost_functions and the shared utility library are NOT in the snapshots.
  # These sketches are reconstructed from how scheduler.cpp and its tests call them, so they show
  # only members we have seen used, with guessed spellings for parameter names. Replace each with a
  # snapshot extract once the real headers are supplied.
  - names: [ContinuousState, "volley::ContinuousState", "std::optional<volley::ContinuousState>", "ContinuousState::GetTrajectories"]
    file: "motion_planner/continuous_state.hpp (not supplied)"
    note: "Reconstructed from call sites in scheduler.cpp and scheduler_tests.cpp; members not used there are missing and parameter names are guesses."
    sketch: |
      // Continuous TIME (not continuous space): every entity's motion along the garage graph,
      // as a timeline. The discrete counterpart is DiscreteGarageState (one snapshot).
      class ContinuousState {
      public:
        // Every entity of `state` stands still at its pose from `start` on
        // (PlanMotions: "all elements just stay at their initial state until right now").
        ContinuousState(const DiscreteGarageState& state, const CollisionTable& table,
                        const Layout& layout, Interval::Timepoint start);
        ContinuousState(const DiscreteGarageState& state, const CollisionTable& table,
                        const Layout& layout);                         // tests: start = Timepoint{}

        void SetTrajectory(GarageEntityIdMsg entity, Trajectory trajectory);   // tests
        // entity -> its Trajectory; iterated as `for (const auto& [entity_id, traj] : ...)`
        const /* map<GarageEntityIdMsg, Trajectory> */ auto& GetTrajectories() const;
      };
  - names: [Trajectory, "volley::Trajectory"]
    file: "motion_planner/trajectory.hpp (not supplied)"
    note: "Reconstructed from call sites in scheduler.cpp and scheduler_tests.cpp; members not used there are missing."
    sketch: |
      // One entity's motions, back to back in time; iterable as a sequence of Motion.
      class Trajectory {
      public:
        void AddMotion(Motion motion);                    // appended in time order (tests)
        std::optional<Interval> GetInterval() const;      // [first begin, last end]; empty if no motions
        // begin() / end() over Motion
      };

      // single-agent helper: timed trajectory for a pose path at the cost model's speeds
      Trajectory ConvertPosePathToTrajectory(const std::vector<GaragePoseMsg>& path,
          const GarageGraph& gg, const cost::MotionCostModel& cost, Interval::Timepoint start,
          GarageEntityIdMsg entity, CollisionEntityId_t collision_id, size_t action_id,
          /* ? */ void* audit, bool loaded);
  - names: [Motion, "volley::Motion", "const volley::Motion&", MotionHasher]
    file: "motion_planner/trajectory.hpp (not supplied)"
    note: "Reconstructed from call sites in scheduler.cpp and scheduler_tests.cpp; members not used there are missing."
    sketch: |
      // One step of one entity: a time interval spent either at a pose (wait / lift / state change)
      // or on an edge (moving pose -> pose), with the footprint it occupies meanwhile.
      class Motion {
      public:
        Motion(GarageEntityIdMsg entity, Interval interval, CollisionEntityId_t collision_id,
               size_t action_id,                          // vertex of the ScheduleEvent it implements
               CollisionTable::PoseOrEdge location);      // a Pose, or an Edge {from, to}

        GarageEntityIdMsg   GetEntityId() const;
        Interval            GetInterval() const;
        CollisionEntityId_t GetCollisionId() const;       // AGV, AGV + tray of a size, bay, ...
        size_t              GetActionId() const;          // ScheduleEventDag::Vertex, as an integer
        CollisionTable::PoseOrEdge GetLocation() const;
        GaragePoseMsg       GetSourcePose() const;        // the pose, or the edge's first pose
        // The discrete change this motion causes, serialized; .type is the ROS message name
        // ("AgvPoseChanged", "AgvLiftChanged", "BayStateChanged", "VecsStateChanged",
        //  "VrcStateChanged"); empty for a plain wait.
        std::optional</* serialized message */> GetDelta() const;
        bool IsIdle() const;
      };
      struct MotionHasher { size_t operator()(const Motion&) const; };
  - names: [Interval, "volley::Interval", "Interval::Duration", "Interval::Timepoint", "volley::Interval::Duration", "volley::Interval::Timepoint"]
