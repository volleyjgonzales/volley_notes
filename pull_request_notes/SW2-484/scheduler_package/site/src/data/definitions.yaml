    note: "Reconstructed from call sites in scheduler.cpp and scheduler_tests.cpp; the clock type is a guess (durations are nanoseconds: the code divides count() by 1e9)."
    sketch: |
      class Interval {
      public:
        using Duration  = std::chrono::nanoseconds;               // count() / 1e9 -> seconds
        using Timepoint = std::chrono::time_point</*clock*/, Duration>;

        Interval(Timepoint begin, Duration length);               // tests: Interval(start, 3s)
        Interval(Timepoint begin, Timepoint end);                 // collapsing VRC traversals
        Timepoint GetBegin() const;
        std::pair<Timepoint, Timepoint> GetTimes() const;         // {begin, end}
        Duration GetDuration() const;
      };
