  - names: [GraphFilterProperties, "volley::GraphFilterProperties", "std::optional<volley::GraphFilterProperties>", GetStaticFilter, "volley::GetStaticFilter", GetDisabledEntitiesFilters]
    file: "motion_planner/static_graph_filtering.hpp (not supplied)"
    note: "Reconstructed from call sites in scheduler.cpp."
    sketch: |
      // Which vertices and edges of the GarageGraph a given footprint may use right now.
      class GraphFilterProperties {
      public:
        bool IsEnabled(GarageGraph::Vertex v) const;
        bool IsEnabled(GarageGraph::Edge e) const;
      };

      // Static obstacles for one footprint: trays and AGVs NOT listed in `movable_trays` /
      // `movable_agvs` block the graph (scheduler passes the ones it is willing to move).
      GraphFilterProperties GetStaticFilter(CollisionEntityId_t footprint, const GarageGraph& gg,
          const DiscreteGarageState& state, const CollisionTable& table,
          const std::unordered_set<uint16_t>& movable_trays,
          const std::unordered_set<uint16_t>& movable_agvs, /* extra */ {});

      // Disabled nodes per footprint; stored in ScheduleContext::disabledness_filters.
