    sketch: |
      // "This is CHUGG v0.1" (PlanMotions). Constructed fresh for every Plan() call.
      class Chugg {
      public:
        Chugg(const GarageGraph& gg,                    // where entities can go
              const CollisionTable& table,              // what overlapping means
              const ScheduleEventDag& events,           // what must happen, in which order
              const ContinuousState& initial,           // everyone parked from start_time
              /* per-edge durations */ edge_durations,  // GetEdgeDurations(gg, cost_model)
              /* all-pairs cost-to-go */ heuristics,    // GetAllPairsMinCost(...), A* heuristic
              const cost::MotionCostModel& cost_model,
              rclcpp::Logger logger);

        // nullopt: no collision-free timing found for this event DAG.
        // audit != nullptr: fills one entry per cost segment (scheduler.cost_audit).
        std::optional<ContinuousState> SolveSequential(cost::CostVector* audit);
      };
