ans-serif" font-size="12" font-weight="500" fill="#2563EB" text-anchor="start" style="white-space:pre" xml:space="preserve">5.13  Will implement</text><text x="358" y="504" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="600" fill="#1E40AF" text-anchor="start" style="white-space:pre" xml:space="preserve">  "tapeSensor": "",</text><rect x="700" y="488" width="224.9" height="22" rx="11" fill="#EA580C" opacity="0.12" /><rect x="700" y="488" width="224.9" height="22" rx="11" fill="none" stroke="#EA580C" stroke-width="1" /><circle cx="711" cy="499" r="7" fill="#EA580C"/><text x="711" y="503" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" style="white-space:pre" xml:space="preserve">C</text><text x="723" y="503.5" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#EA580C" text-anchor="start" style="white-space:pre" xml:space="preserve">5.3  Conditional / to discuss</text><text x="358" y="529" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="600" fill="#1E40AF" text-anchor="start" style="white-space:pre" xml:space="preserve">  "laserField": 12</text><rect x="700" y="513" width="164.4" height="22" rx="11" fill="#2563EB" opacity="0.12" /><rect x="700" y="513" width="164.4" height="22" rx="11" fill="none" stroke="#2563EB" stroke-width="1" /><circle cx="711" cy="524" r="7" fill="#2563EB"/><text x="711" y="528" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" style="white-space:pre" xml:space="preserve">I</text><text x="723" y="528.5" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#2563EB" text-anchor="start" style="white-space:pre" xml:space="preserve">5.15  Will implement</text><text x="358" y="554" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#1E40AF" text-anchor="start" style="white-space:pre" xml:space="preserve">}</text><line x1="684" y1="317" x2="684" y2="433" stroke="#64748B" stroke-width="1.4" stroke-linecap="round"/><text x="692" y="370" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="start" style="white-space:pre" xml:space="preserve">header, assumed to match</text><text x="692" y="384" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="start" style="white-space:pre" xml:space="preserve">the VDA5050 message header</text><line x1="250" y1="314" x2="334" y2="449" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#ah-slate)"/><line x1="250" y1="344" x2="334" y2="474" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#ah-slate)"/><line x1="250" y1="374" x2="334" y2="499" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#ah-slate)"/><line x1="250" y1="404" x2="334" y2="524" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#ah-slate)"/><rect x="28" y="588" width="904" height="50.8" rx="6" fill="#EFF6FF" /><rect x="28" y="588" width="4" height="50.8" rx="2" fill="#EA580C" /><text x="42" y="609.8" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start" style="white-space:pre" xml:space="preserve">5.3 Volley asks for an empty string or omitted value when the sensor reads nothing. HITO proposes instead that</text><text x="42" y="626.6" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start" style="white-space:pre" xml:space="preserve">a value stuck at 0 for 1 second means no reading. 0 is also a valid reading, so this needs a decision.</text></svg>